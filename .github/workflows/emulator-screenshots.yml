name: Emulator screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/emulator-screenshots.yml'
      - '.github/scripts/**'

permissions:
  contents: write

concurrency:
  group: emulator-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play a game on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/emulator-run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Save screenshots to the emulator-screenshots branch
        if: always()
        run: |
          if ls screenshots/*.png >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/shots"
            cp screenshots/* "$RUNNER_TEMP/shots/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --orphan emulator-screenshots
            cp "$RUNNER_TEMP"/shots/* .
            git add *.png *.txt
            git commit -m "Screenshots from $GITHUB_SHA"
            git push --force origin emulator-screenshots
          fi
